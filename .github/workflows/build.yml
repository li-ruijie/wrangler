name: Build wrangler packages

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "wrangler version override, for example 4.125.0. Empty means latest."
        required: false
        type: string
      force:
        description: "Rebuild even when the release already exists"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

env:
  # The minimum wrangler declares, and the version the .deb depends on. The
  # vendored tree is prebuilt binaries and bundled JavaScript with no native
  # compilation, so the build's Node version does not reach the artifacts.
  NODE_VERSION: '22'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve the upstream version and decide whether to build
        id: resolve
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
          else
            VERSION=$(curl -fsSL https://registry.npmjs.org/wrangler/latest | jq -r '.version')
          fi

          # Catches a malformed or prerelease version in seconds rather than
          # after two full installs, and keeps the tag in the vX.Y.Z shape the
          # release tooling and the scoop manifest both expect.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected wrangler version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "Rebuilding $VERSION (forced)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" -R "$REPO" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the packaging scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the wrangler tree
        shell: bash
        run: scripts/install-tree.sh "${{ needs.check.outputs.version }}" dist

      - name: Add the launcher
        shell: bash
        run: cp windows/wrangler.cmd dist/wrangler.cmd

      - name: Create the archive
        shell: bash
        run: |
          # Zipped from inside dist so the archive is flat and the scoop
          # manifest needs no extract_dir.
          (cd dist && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/wrangler-windows-x64.zip" . > /dev/null)
          ls -la wrangler-windows-x64.zip

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: wrangler-windows-x64.zip
          if-no-files-found: error

  build-linux:
    needs: check
    if: needs.check.outputs.skip == 'false'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout the packaging scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the wrangler tree
        run: scripts/install-tree.sh "${{ needs.check.outputs.version }}" dist

      - name: Build the .deb
        run: |
          scripts/package-deb.sh dist "${{ needs.check.outputs.version }}" \
            "${{ matrix.arch }}" out

      - name: Smoke test the .deb
        run: |
          scripts/smoke-test.sh \
            "out/wrangler_${{ needs.check.outputs.version }}_${{ matrix.arch }}.deb" \
            "${{ needs.check.outputs.version }}"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error

  publish:
    needs: [check, build-windows, build-linux]
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksum the assets
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd dist
          # Named explicitly rather than globbed, so SHA256SUMS.txt cannot list
          # itself and a missing artifact fails here instead of shipping.
          sha256sum \
            "wrangler-windows-x64.zip" \
            "wrangler_${VERSION}_amd64.deb" \
            "wrangler_${VERSION}_arm64.deb" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          ls -la dist
          # -R is required: this job does not check out the repository, so gh
          # has no remote to infer the target from. A forced rebuild reuses the
          # tag and gh refuses to create a release that exists, so replace it.
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Replacing the existing release for $TAG"
            gh release delete "$TAG" -R "$REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* -R "$REPO" \
            --title "wrangler $VERSION" \
            --notes "wrangler $VERSION vendored with its production dependencies, including the workerd runtime. Built from the npm release, which carries no binaries of its own."

      - name: Dispatch to the APT repository
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # A secret set with `echo "$token" | gh secret set` carries a trailing
          # newline, which the API rejects. Strip stray whitespace rather than
          # depending on how the secret was set.
          TOKEN=$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "::error::APT_DISPATCH_TOKEN is empty"
            exit 1
          fi
          export GH_TOKEN="$TOKEN"
          base="https://github.com/${REPO}/releases/download/v${VERSION}"
          urls=$(for f in dist/*.deb; do printf '"%s/%s",' "$base" "$(basename "$f")"; done)
          gh api repos/li-ruijie/apt/dispatches -X POST --input - <<PAYLOAD
          {
            "event_type": "add-debs",
            "client_payload": { "debs": [ ${urls%,} ] }
          }
          PAYLOAD
